# ==========================================================
# Pawdoro Backend - Base configuration
# Week 1 scope: application skeleton wired to PostgreSQL.
# All values can be overridden via environment variables so
# real credentials never need to be committed to Git.
# ==========================================================

spring.application.name=pawdoro-backend
pawdoro.app.version=0.1.0

server.port=${SERVER_PORT:8080}

# ---- PostgreSQL connection ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/pawdoro}
spring.datasource.username=${DB_USERNAME:pawdoro}
spring.datasource.password=${DB_PASSWORD:pawdoro}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA / Hibernate ----
# ddl-auto=update is acceptable for local/dev work in Week 1.
# This will be revisited (e.g. migrated to Flyway/Liquibase) once
# real entities are introduced from Week 2 onward.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---- Actuator ----
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
